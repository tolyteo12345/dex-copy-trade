# One container (= one process) per chain: ETH and SOL share nothing at runtime, so a busy
# or failing SOL bot cannot slow down ETH and vice versa. Run one with
# `docker compose up -d eth-bot` (or `sol-bot`), both with `docker compose up -d`.
#
# Configuration (incl. PRIVATE_KEY / SOL_PRIVATE_KEY) comes from .env — never commit it.
# DRY_RUN and SOL_DRY_RUN default to true; `false` trades REAL funds.

x-bot: &bot
  env_file: .env
  restart: unless-stopped
  # The bots drain in-flight trades for up to 15s on SIGTERM; give them margin.
  stop_signal: SIGTERM
  stop_grace_period: 30s
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  eth-bot:
    <<: *bot
    build:
      context: .
      args:
        BIN: eth-copy-trade
        FEATURES: --no-default-features
    image: dex-copy-trade-eth:latest

  sol-bot:
    <<: *bot
    build:
      context: .
      args:
        BIN: sol-copy-trade
        FEATURES: ""
    image: dex-copy-trade-sol:latest
