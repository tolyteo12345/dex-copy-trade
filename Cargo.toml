[package]
name = "dex-copy-trade"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
alloy = { version = "2.5", features = ["providers", "provider-ws", "provider-http", "rpc-types", "signer-local", "network", "consensus", "sol-types", "k256"] }
anyhow = "1.0.104"
dashmap = "6"
dotenvy = "0.15.7"
futures = "0.3.34"
parking_lot = "0.12"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
